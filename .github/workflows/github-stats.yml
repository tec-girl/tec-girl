name: Stats propios

# Genera la tarjeta de GitHub Stats dentro de este mismo repositorio
# (assets/github-stats.svg), sin depender del servicio público de
# github-readme-stats, que quedó pausado. Se actualiza cada día y
# también se puede lanzar a mano desde la pestaña Actions.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

concurrency:
  group: stats-propios
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar la tarjeta de stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Guardar la tarjeta si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "Sin cambios en la tarjeta."
          else
            git commit -F - <<'EOF'
            Stats propios: actualizar la tarjeta de GitHub Stats

            Co-authored-by: psehgaft <psehgaft@users.noreply.github.com>
            Co-authored-by: san985tos <san985tos@users.noreply.github.com>
            Co-authored-by: frankjunker87-arch <frankjunker87-arch@users.noreply.github.com>
            Co-authored-by: tec-girl <keysi-kunz@users.noreply.github.com>
            Co-authored-by: keysikunz <keysikunz@users.noreply.github.com>
            EOF
            git push
          fi
